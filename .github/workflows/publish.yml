name: Publish site

# Any push to this branch asks the deploy workflow on main to publish it.
# (Deployments run from main so they stay within the github-pages environment rules.)
on:
  push:
    branches: [gh-pages]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
