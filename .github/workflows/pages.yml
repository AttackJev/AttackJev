name: Deploy project page

# The site lives on the gh-pages branch. This workflow runs from main (so it is allowed
# to deploy to the github-pages environment), checks that branch out and publishes it.
# It is started by gh-pages/.github/workflows/publish.yml on every push to gh-pages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
